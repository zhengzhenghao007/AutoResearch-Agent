name: Offline checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  python:
    name: Python offline (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    env:
      PYTHON_DOTENV_DISABLED: '1'
      OPENAI_API_KEY: ''
      OPENROUTER_API_KEY: ''
      LANGSMITH_API_KEY: ''
      LANGSMITH_TRACING: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - name: Run offline regression (network sockets forbidden)
        run: python -m pytest tests -q -p no:cacheprovider --disable-socket --allow-unix-socket
      - name: Evidence fixture integrity and evaluation availability
        run: python -m evaluation.evaluate_evidence

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
